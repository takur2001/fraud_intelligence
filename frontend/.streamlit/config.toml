[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#172554"
textColor = "#F8FAFC"
primaryColor = "#60A5FA"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true

[client]
showErrorDetails = true
toolbarMode = "minimal"